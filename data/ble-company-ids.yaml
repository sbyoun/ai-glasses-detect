# 블루투스 SIG 제조사 ID (Company Identifier) 중 스마트안경 업체
#
# 1차 출처: Bluetooth SIG assigned numbers, company_identifiers.yaml
#   https://bitbucket.org/bluetooth-SIG/public/src/main/assigned_numbers/company_identifiers/company_identifiers.yaml
# 확인일: 2026-11-18
#
# glasses_only: 이 ID 를 쓰는 기기가 사실상 안경·헤드셋뿐인가
#   true  → 이 ID 가 잡히면 안경일 가능성이 높다
#   false → 같은 회사의 폰·이어폰·워치도 같은 ID 를 써서 오탐이 많다
#
# 주의: 제조사 ID 는 BLE 광고 패킷의 Manufacturer Specific Data 에 실린다.
# 기기가 광고를 하지 않거나(이미 폰과 연결된 상태 등) 이 필드를 비우면 안 잡힌다.
# 아래 표는 "ID 가 존재한다"는 뜻이지, 우리가 실기기로 잡아 본 결과가 아니다.

