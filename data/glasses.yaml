# AI 스마트안경 모델별 식별 정보
#
# 값의 원칙
# - 모든 값은 sources 의 공개 자료에서 왔다. 실기기로 측정한 값은 없다.
# - 모르는 값은 null 로 둔다. 추정으로 채우지 않는다.
# - ble.detectable: 제조사 ID 로 식별 가능한가 (ble-company-ids.yaml 기준)
#     yes     안경 전용 ID 가 SIG 에 등록돼 있다
#     partial ID 는 있으나 같은 회사 폰·이어폰과 겹친다
#     no      SIG 목록에 업체가 없다
#   실제로 광고 패킷에 그 ID 를 싣는지는 모델마다 다를 수 있다(실측 전).
# - kr_sales: official(국내 정식 판매) | import(직구·구매대행으로만) | unknown
#
# 확인일: 2026-11-18

models:
  - id: ray-ban-meta-gen2
    name: Ray-Ban Meta (Gen 2)
    maker: Meta × EssilorLuxottica
    camera: {present: true, spec: 12MP}
    display: null          # 화면 없음. 답은 스피커(음성)로 받는다
    audio: true
    weight_g: null
    price: "US$379부터, 국내 69만 원부터"
    kr_sales: official
    kr_note: 2026-05-25 국내 정식 출시. 7월부터 이통 3사 판매
    ble: {ids: [0x01AB, 0x058E, 0x0D53], detectable: "yes"}
    tells:
      - 테 앞쪽 모서리의 작은 카메라 구멍과 촬영 표시등
      - 일반 레이밴보다 두꺼운 안경다리
      - 안경다리 안쪽·테의 로고
    exam_risk: 화면이 없어 답을 귀로 듣는다. 귀 쪽 스피커 소리, 안경다리를 자주 만지는 행동이 단서
    sources:
      - https://about.fb.com/ko/news/2026/05/meta-wearables-launch-in-korea/
      - https://mobile.newsis.com/view/NISX20260519_0003635283
      - https://www.ddaily.co.kr/page/view/2026070618161755548
      - https://www.theshortcut.com/p/meta-ray-ban-display-price-release-date
      - https://www.helpnetsecurity.com/2026/02/27/nearby-glasses-android-app-detect-smart-glasses/

  - id: meta-ray-ban-display
    name: Meta Ray-Ban Display
    maker: Meta × EssilorLuxottica
    camera: {present: true, spec: 12MP 초광각}
    display: {type: 단안(오른쪽 렌즈) 컬러 HUD, spec: "600×600, 20도 시야각"}
    audio: true
    weight_g: 69
    price: "US$799 (손목 밴드 포함)"
    kr_sales: unknown
    ble: {ids: [0x01AB, 0x058E, 0x0D53], detectable: "yes"}
    tells:
      - 손목의 Meta Neural Band(근전도 밴드)로 조작한다. 손목 밴드가 단서
      - 오른쪽 렌즈에 화면이 있어 각도에 따라 렌즈 속 빛·반사가 보일 수 있다
      - 일반 레이밴보다 두껍고 무겁다(69g)
    exam_risk: 화면에 답이 바로 뜬다. 손가락 움직임만으로 조작할 수 있다
    sources:
      - https://roadtovr.com/meta-ray-ban-smart-glasses-display-price-release-date-specs/
      - https://www.tomsguide.com/computing/smart-glasses/meta-ray-ban-display-glasses-features-neural-link-price-and-availability
      - https://www.theshortcut.com/p/meta-ray-ban-display-price-release-date

