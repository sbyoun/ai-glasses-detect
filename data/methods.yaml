# 시험장 탐지 방법별로 잡는 것과 못 잡는 것
# 공개 보도·제품 설명·논문 기준. 우리가 직접 성능을 시험한 것은 없다.
# 확인일: 2026-11-18

methods:
  - id: visual
    name: 육안 확인
    catches:
      - 렌즈 옆·테 모서리의 카메라 구멍, 촬영 표시등
      - 일반 안경보다 두꺼운 안경다리, 안경테 로고
      - 각도에 따라 달라지는 렌즈 색(웨이브가이드 화면)
      - 안경다리를 자주 만지는 행동, 시선 처리 이상
    misses:
      - 카메라가 없는 화면형 안경(Even Realities 등)은 일반 안경과 거의 같다
      - 표시등을 없애는 등 기기를 고친 경우
    cost: 감독관 교육만 필요
    sources:
      - https://www.segye.com/newsView/20260802511782
      - https://m.seoul.co.kr/news/2026/07/13/20260713500273

  - id: ble-company-id
    name: 블루투스 제조사 ID 스캔
    tools:
      - name: Nearby Glasses (안드로이드, AGPL-3.0)
        url: https://github.com/yjeanrenaud/yj_nearbyglasses
    catches:
      - 광고 패킷에 안경 업체 ID(메타·룩소티카·스냅 등)를 싣는 기기
    misses:
      - SIG 에 업체 ID 가 없는 안경(Rokid, XREAL, Brilliant Labs)
      - 광고를 하지 않는 상태의 기기
      - 폰·이어폰과 ID 를 같이 쓰는 업체(샤오미·TCL 등)는 오탐이 많다
    cost: 무료, 안드로이드 폰 한 대
    sources:
      - https://www.helpnetsecurity.com/2026/02/27/nearby-glasses-android-app-detect-smart-glasses/

  - id: baseline-scan
    name: 빈 교실 기준선 비교 스캔
    tools:
      - name: 코리요스캔 KoriyoSCAN (안드로이드, 소스 공개)
        url: https://www.munhwa.com/article/11632062
    catches:
      - 수험생 입실 뒤 새로 나타난 블루투스·와이파이 신호
    misses:
      - 블루투스·와이파이를 끄고 LTE·5G 만 쓰는 기기
      - 유선 연결 카메라
      - 목걸이형·귓속 초소형 수신기
      - (개발자 본인이 밝힌 한계)
    cost: 무료. 감독관 휴대폰 사용 허가가 필요하다
    sources:
      - https://www.munhwa.com/article/11632062
      - https://www.hankyung.com/article/202611172254i

  - id: rf-detector
    name: 전용 전파탐지기
    catches:
      - 휴대전화·무선 송신 신호
    misses:
      - 시판 장비의 AI 안경 탐지 성능은 공개 검증 결과가 없다
    cost: 장비 구매. 한국방송통신전파진흥원이 시험장용 블루투스·와이파이 탐지 장비 개발 사업을 공고했다
    sources:
      - https://www.fnnews.com/news/202611151534055370
      - https://www.koreajoongangdaily.com/korea/hidden-in-plain-sight-schools-hunt-for-ai-smart-glasses-ahead-of-college-entrance-exam/12965932

  - id: metal-detector
    name: 금속탐지
    catches:
      - 안경 속 전자부품, 몸에 숨긴 폰·배터리
    misses:
      - 안경테·지퍼·보청기 등 오탐이 많아 판정에 시간이 든다
    cost: 장비와 검색 인력
    sources:
      - https://www.taiwannews.com.tw/en/news/6400781

  - id: optical
    name: 광학 신호 분석(연구 단계)
    catches:
      - 스마트폰 카메라로 렌즈 속 웨이브가이드(AR 화면 부품)를 찾는다. 논문 기준 약 80% 정확도
    misses:
      - 화면이 없는 카메라형 안경
    cost: 제품화 전
    sources:
      - https://comphealth.duke.edu/publications/no-guide-no-cheat-detecting-smart-glasses-via-ar-optical-signatures/

  - id: allowed-items
    name: 반입 허용 물품 점검
    catches:
      - 개조한 계산기 등 허용 물품에 숨긴 카메라·송신 장치 (세무사 사건 수법)
    misses:
      - 점검하지 않으면 그대로 통과한다. 시험 기관이 계산기를 지급하는 방식이 근본 대책
    cost: 검사 시간, 또는 지급용 계산기 구매
    sources:
      - https://www.hankookilbo.com/news/article/A2026111713030003155

  - id: post-hoc
    name: 사후 점수 분석
    catches:
      - 비정상 고득점, 회차별 득점 분포 급변(세무사 회계학 90점 이상 2명 → 66명)
    misses:
      - 합격선 근처로 일부러 틀리면 개인을 가려내기 어렵다
    cost: 시험 기관 데이터 분석
    sources:
      - https://m.news.nate.com/view/20261118n01463
